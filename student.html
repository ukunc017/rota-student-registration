<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rota Education Consultancy — Başvurum</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html" aria-label="RotaEdu Turkey">
        <img class="brand-logo" src="assets/logo.svg" alt="RotaEdu Turkey — Your pathway to Turkish education" />
      </a>
      <nav class="header-nav" aria-label="Main">
        <a class="header-link" href="index.html" data-i18n="nav_universities">Üniversiteler</a>
        <a class="header-link" href="how-it-works.html" data-i18n="nav_how_it_works">Nasıl çalışır</a>
        <a class="header-link" href="contact.html" data-i18n="nav_contact">İletişim</a>
        <a class="header-link is-active" href="student.html" data-i18n="nav_my_file">Başvurum</a>
      </nav>
      <div class="header-account">
        <span class="role-badge role-student" id="role-badge" hidden></span>
        <select class="lang-select" data-lang-select onchange="rotaI18n.setLang(this.value); render()"></select>
        <button class="btn-logout" data-i18n="nav_logout" onclick="rotaAuth.signOut()">Çıkış Yap</button>
      </div>
    </div>
  </header>

  <main>
    <div class="container" id="app" style="max-width: 760px; margin: 0 auto;">
      <p class="empty-state" data-i18n="loading">Yükleniyor...</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/i18n-catalog.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
