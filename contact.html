<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rota Education Consultancy — İletişim</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html" aria-label="RotaEdu Turkey">
        <img class="brand-logo" src="assets/logo.svg" alt="RotaEdu Turkey — Your pathway to Turkish education" />
      </a>
      <nav class="header-nav" aria-label="Main">
        <a class="header-link" href="index.html" data-i18n="nav_universities">Üniversiteler</a>
        <a class="header-link" href="how-it-works.html" data-i18n="nav_how_it_works">Nasıl çalışır</a>
        <a class="header-link is-active" href="contact.html" data-i18n="nav_contact">İletişim</a>
      </nav>
      <div class="header-account">
        <select class="lang-select" data-lang-select onchange="rotaI18n.setLang(this.value)"></select>
        <span id="auth-slot"></span>
      </div>
    </div>
  </header>

  <main>
    <div class="container page-narrow">
      <section class="contact-page">
        <h1 data-i18n="contact_title">İletişim</h1>
        <p class="contact-lead" data-i18n="contact_text">
          Başvuru dosyanız üzerinden güncellemeleri takip edebilirsiniz. Hesabınız yoksa önce kayıt olun; danışmanlık ekibi süreç boyunca sizinle iletişime geçer.
        </p>

        <div class="contact-grid" id="contact-details"></div>

        <div class="contact-social-block">
          <h2 data-i18n="contact_social_title">Sosyal medya</h2>
          <p class="muted" data-i18n="contact_social_lead">Güncel duyurular ve öğrenci hikâyeleri için bizi takip edin.</p>
          <div class="social-row" id="contact-social"></div>
        </div>

        <a class="btn contact-cta-btn" href="account.html" data-i18n="contact_cta">Giriş / Kayıt</a>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/contact-info.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/i18n-catalog.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const SOCIAL_ICONS = {
      instagram: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9A5.5 5.5 0 0 1 16.5 22h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9zm9.75 1.25a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>`,
      facebook: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14 9h3V6h-3c-2.2 0-4 1.8-4 4v2H8v3h2v7h3v-7h2.6l.4-3H13v-2c0-.6.4-1 1-1z"/></svg>`,
      twitter: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.9 2H21l-6.5 7.4L22 22h-6.8l-4.4-5.8L5.7 22H3.5l7-8L2 2h7l4 5.3L18.9 2zm-1.2 18h1.9L7.4 3.9H5.4L17.7 20z"/></svg>`,
      linkedin: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.5 9.5H3.7V21h2.8V9.5zM5.1 3a1.8 1.8 0 1 0 0 3.6A1.8 1.8 0 0 0 5.1 3zM20.3 21h-2.8v-5.6c0-1.5-.5-2.5-1.8-2.5-1 0-1.5.7-1.8 1.3-.1.2-.1.6-.1.9V21h-2.8s.1-9.3 0-10.3h2.8v1.5c.4-.6 1.1-1.7 2.8-1.7 2 0 3.5 1.3 3.5 4.2V21z"/></svg>`,
    };

    function renderContact() {
      const t = (k) => rotaI18n.t(k);
      const c = window.ROTA_CONTACT || {};
      const details = document.getElementById("contact-details");
      const rows = [
        ["contact_label_company", c.company],
        ["contact_label_about", t("contact_about")],
        ["contact_label_email", c.email ? `<a href="mailto:${c.email}">${c.email}</a>` : ""],
        ["contact_label_phone", c.phone],
        ["contact_label_address", c.address],
        ["contact_label_hours", c.hours],
      ].filter(([, v]) => v);

      details.innerHTML = rows
        .map(
          ([labelKey, value]) => `
        <div class="contact-item">
          <div class="contact-item-label">${t(labelKey)}</div>
          <div class="contact-item-value">${value}</div>
        </div>`
        )
        .join("");

      const social = document.getElementById("contact-social");
      const links = c.social || {};
      const labels = { instagram: "Instagram", facebook: "Facebook", twitter: "X", linkedin: "LinkedIn" };
      const items = Object.keys(SOCIAL_ICONS).filter((key) => {
        const url = (links[key] || "").trim();
        return url && !url.endsWith("://") && url !== "https://instagram.com/" && url !== "https://facebook.com/" && url !== "https://x.com/" && url !== "https://linkedin.com/";
      });

      if (!items.length) {
        social.innerHTML = `<p class="muted">${t("contact_social_empty")}</p>`;
        return;
      }

      social.innerHTML = items
        .map(
          (key) => `
          <a class="social-btn social-${key}" href="${links[key].trim()}" target="_blank" rel="noopener noreferrer" aria-label="${labels[key]}">
            ${SOCIAL_ICONS[key]}
            <span>${labels[key]}</span>
          </a>`
        )
        .join("");
    }

    rotaI18n.applyI18n();
    renderContact();

    (async function () {
      const slot = document.getElementById("auth-slot");
      if (!slot) return;
      const result = await rotaAuth.getCurrentProfile();
      const t = (k) => rotaI18n.t(k);
      if (!result) {
        slot.innerHTML = `<a class="btn-logout" href="account.html">${t("nav_sign_in")}</a>`;
        return;
      }
      const href = result.profile.role === "admin" ? "admin.html" : "student.html";
      const label = result.profile.role === "admin" ? t("nav_admin") : t("nav_my_file");
      slot.innerHTML = `<a class="btn-logout" href="${href}">${label}</a>`;
    })();
  </script>
</body>
</html>
